name: profile

# GitHub disables a schedule after 60 days without repository activity, and a
# push made with GITHUB_TOKEN does not reset that clock. If the readout ever
# goes stale, run this once by hand to wake it back up.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# No push trigger on purpose: with a PAT in PROFILE_TOKEN, the commit this job
# makes would trigger the job again.

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: a tag can be moved, and this job runs with
      # PROFILE_TOKEN in its environment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # nothing to cache: the generator has no dependencies

      - name: Render the readout
        env:
          # A read-only PAT counts private work in the totals. Without it
          # the built-in token sees public repos only.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: go run ./cmd/profile -art assets/frames/donut.txt

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/terminal.svg
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Redraw the readout"
          git push
